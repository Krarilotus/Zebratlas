[workspace]
members = ["crates/*"]
exclude = ["third_party/query-by-graph/app"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.91"

[workspace.dependencies]
atlas-core = { path = "crates/atlas-core" }
atlas-ingest = { path = "crates/atlas-ingest" }
atlas-analytics = { path = "crates/atlas-analytics" }
atlas-journeys = { path = "crates/atlas-journeys" }

anyhow = "1"
axum = "0.8"
bincode = "1.3"
caseless = "0.2"
clap = { version = "4", features = ["derive", "env"] }
csv = "1.3"
humantime = "2"
indexmap = { version = "2", features = ["serde"] }
quick-xml = "0.41"
regex = "1"
serde = { version = "1", features = ["derive"] }
# Source-cache producers hash Python's binary64 JSON representation. Preserve
# parsed binary64 values exactly before atlas-ingest applies that spelling.
serde_json = { version = "1", features = ["float_roundtrip"] }
sha2 = "0.10"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "signal"] }
tower-http = { version = "0.6", features = ["cors"] }

# Parsing 200 MB of sources in a debug build is slow; optimise dependencies, keep own code quick to compile.
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.release]
debug = "line-tables-only"
