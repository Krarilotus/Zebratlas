[package]
name = "atlas-connector"
description = "Outbound personal model connector and read-only graph MCP bridge."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
anyhow.workspace = true
async-trait = "0.1"
atlas-accounts = { path = "../atlas-accounts" }
atlas-llm = { path = "../atlas-llm" }
axum = { workspace = true, features = ["ws"] }
clap.workspace = true
futures-util = { version = "0.3", features = ["sink"] }
getrandom = "0.4"
humantime.workspace = true
keyring = { version = "3", features = ["windows-native", "apple-native", "linux-native"] }
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls"] }
rusqlite = { version = "0.40", features = ["bundled"] }
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
tokio = { workspace = true, features = ["time", "sync", "io-std", "io-util"] }
tokio-tungstenite = { version = "0.29", features = ["rustls-tls-webpki-roots"] }
url = "2"

[dev-dependencies]
tempfile = "3"
tower = { version = "0.5", features = ["util"] }
wiremock = "0.6"
