[package]
name = "atlas-server"
description = "Rare-disease atlas HTTP API (axum) and CLI."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
anyhow.workspace = true
atlas-accounts = { path = "../atlas-accounts" }
atlas-analytics.workspace = true
atlas-ask = { path = "../atlas-ask" }
atlas-contrib = { path = "../atlas-contrib", features = ["core"] }
atlas-connector = { path = "../atlas-connector" }
async-trait = "0.1"
atlas-core.workspace = true
atlas-journeys.workspace = true
atlas-ingest.workspace = true
atlas-llm = { path = "../atlas-llm" }
atlas-intake = { path = "../atlas-intake" }
axum = { workspace = true, features = ["multipart"] }
clap.workspace = true
getrandom = "0.4"
humantime.workspace = true
futures-util = { version = "0.3", default-features = false }
reqwest = { version = "0.13", default-features = false, features = ["rustls", "stream", "query"] }
sha2.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["sync"] }
tower-http.workspace = true
tower = { version = "0.5", features = ["util"] }

[dev-dependencies]
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls"] }
tokio-tungstenite = "0.29"
tempfile = "3"
wiremock = "0.6"
