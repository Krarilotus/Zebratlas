# zebratlas: per-client rate-limit zone for /api/ (http context; used only by @ZA_DOMAIN@.conf).
limit_req_zone $binary_remote_addr zone=zebratlas_api:10m rate=10r/s;
# No query strings, headers, recipient addresses or request bodies in app access logs.
log_format zebratlas_safe escape=json '{"method":"$request_method","path":"$uri","status":$status,"bytes":$body_bytes_sent,"seconds":$request_time}';
