# @ZA_DOMAIN@ — rare-disease atlas. Managed by ops/server/60-nginx.sh (rare-disease-atlas repo).
# Same pattern as the other sites on this host: host nginx + certbot (Let's Encrypt),
# app reachable only on 127.0.0.1. Certificate: certbot certonly --webroot (ECDSA),
# renewed by the existing certbot.timer; reload via the deploy hook.

# HTTP: ACME challenges, everything else to HTTPS on the apex.
server {
    listen 80;
    listen [::]:80;
    server_name @ZA_DOMAIN@ @ZA_ALIASES@;
    access_log /var/log/nginx/zebratlas.access.log zebratlas_safe;
    error_log /dev/null;

    location /.well-known/acme-challenge/ {
        root @ZA_ACME_ROOT@;
        default_type text/plain;
    }
    location / {
        return 301 https://@ZA_DOMAIN@$request_uri;
    }
}

# HTTPS www -> apex.
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name @ZA_ALIASES@;
    access_log /var/log/nginx/zebratlas.access.log zebratlas_safe;
    error_log /dev/null;

    ssl_certificate /etc/letsencrypt/live/@ZA_DOMAIN@/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/@ZA_DOMAIN@/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;

    return 301 https://@ZA_DOMAIN@$request_uri;
}

# HTTPS apex: /api/* -> atlas-server, everything else -> Next.js.
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name @ZA_DOMAIN@;

    ssl_certificate /etc/letsencrypt/live/@ZA_DOMAIN@/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/@ZA_DOMAIN@/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;

    access_log /var/log/nginx/zebratlas.access.log zebratlas_safe;
    # nginx error records can echo raw request URLs. Operational gates use health/receipts.
    error_log /dev/null;

    client_max_body_size 2m;
    server_tokens off;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
    # No preload/includeSubDomains until every subdomain has an HTTPS lifecycle.
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Common proxy headers. X-Forwarded-For is OVERWRITTEN (not appended): the API
    # rate-limits on the first X-Forwarded-For address, so a client must not set it.
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto https;
    proxy_http_version 1.1;

    location /api/ {
        limit_req zone=zebratlas_api burst=40 nodelay;
        limit_req_status 429;
        proxy_read_timeout 120s;      # LLM-backed endpoints
        proxy_buffering off;          # server-sent events (/api/ask?stream=1)
        proxy_pass http://127.0.0.1:@ZA_API_PORT@;
    }

    location / {
        # A location with its own proxy_set_header inherits none from the server
        # block, so all headers are repeated here.
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 120s;
        proxy_buffering off;          # streamed assistant answers (/<lang>/ask/stream)
        proxy_pass http://127.0.0.1:@ZA_WEB_PORT@;
    }
}
